[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_unflags = -Os
build_flags = -O2
board_build.arduino.earlephilhower.usb_product = Talko_SpeakJet 0.9.3
board_build.arduino.earlephilhower.usb_manufacturer = Polaxis

[env:diagnostic]
extends = env:pico
build_flags = ${env:pico.build_flags} -DTALKO_DIAGNOSTICS
board_build.arduino.earlephilhower.usb_product = Talko_SpeakJet 0.9.3 diagnostic
